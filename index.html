<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bennett's Budgies on Tour</title>

    <style>
        /* --- GLOBAL --- */
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: #0a0f1f;
            color: #e0e8ff;
            text-align: center;
        }

        /* --- HEADER --- */
        header {
            padding: 2rem 1rem;
        }

        .logo {
            width: 450px;
            filter: drop-shadow(0 0 12px #00eaff);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-top: 1rem;
            color: #00eaff;
            text-shadow: 0 0 12px #00eaff;
        }

        /* --- MAIN CONTENT --- */
        main {
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .intro p {
            font-size: 1.2rem;
            opacity: 0.85;
            margin-bottom: 2rem;
        }

        /* --- SECTION HEADERS --- */
        .linktree-section h3 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            color: #7df9ff;
            text-shadow: 0 0 10px #7df9ff;
        }

        /* --- CYBERPUNK BUTTONS --- */
        #linktree-widget {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-btn {
            display: inline-block;
            padding: 1rem 1.4rem;
            background: rgba(0, 234, 255, 0.1);
            border: 2px solid #00eaff;
            border-radius: 10px;
            color: #00eaff;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: 0.25s;
            box-shadow: 0 0 12px rgba(0, 234, 255, 0.4);
        }

        .link-btn:hover {
            background: #00eaff;
            color: #0a0f1f;
            box-shadow: 0 0 20px #00eaff;
            transform: translateY(-3px);
        }

        /* --- FOOTER --- */
        footer {
            margin-top: 3rem;
            padding: 2rem 0;
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <header>
        <img src="images/Bennett'sBudgies(Transparent)800x206.png" class="logo" alt="Bennett's Budgies Logo">
        <h1>Bennett's Budgies on Tour</h1>
    </header>

    <main>
        <section class="intro">
            <p>Welcome to the official website for Bennett's Budgies. Follow along with chairman Alan Bennett's Budgies.</p>
        </section>

        <section class="linktree-section">
            <h3>Connect With Us</h3>
            <div id="linktree-widget">
                <a href="https://www.youtube.com/@BennettsBudgies" target="_blank" class="link-btn">YouTube Channel</a>
                <a href="https://linktr.ee/bennettsbudgies" target="_blank" class="link-btn">Linktree</a>
                <!--<a href="#" class="link-btn">Spotify Playlist</a> -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Bennett's Budgies.</p>
    </footer>
</body>
</html>
